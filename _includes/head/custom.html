<!-- External Libraries: D3 and MathJax -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<!-- Configurations and Initializations -->
<script>
  // 1. MathJax Configuration
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']]
    },
    svg: {
      fontCache: 'global'
    }
  };
</script>

<!-- Mermaid Library & Runtime Initialization -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  
  // Initialize Mermaid configuration
  mermaid.initialize({ 
    startOnLoad: true, 
    theme: 'default' 
  });

  // Render markdown code fences site-wide once DOM is ready
  window.addEventListener('DOMContentLoaded', async () => {
    await mermaid.run({
      querySelector: '.language-mermaid, pre.mermaid, code.mermaid'
    });
  });
</script>
