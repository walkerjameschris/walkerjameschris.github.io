<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; font-family: monospace; }
    .widget { background: #252a34; border: 1px solid #3b4252; border-radius: 6px; padding: 16px; }
    label { display: block; color: #81a1c1; margin-bottom: 6px; font-size: 13px; }
    input[type="text"] {
      width: 100%; background: #1d212a; color: #e5e9f0;
      border: 1px solid #3b4252; border-radius: 4px; padding: 10px;
      font-size: 16px; outline: none; font-family: monospace;
    }
    input[type="text"]:focus { border-color: #81a1c1; }
    button {
      margin-top: 10px; padding: 8px 16px; background: #81a1c1; color: #252a34;
      border: none; border-radius: 4px; font-family: monospace; font-weight: bold;
      cursor: pointer; font-size: 14px;
    }
    button:hover { background: #88c0d0; }
    .counts { margin-top: 12px; font-size: 15px; color: #81a1c1; font-weight: bold; }
  </style>
</head>
<body>
  <div class="widget">
    <label for="input">Enter a Single Word (No Spaces):</label>
    <input type="text" id="input" placeholder="e.g. apple" maxlength="15" autocomplete="off" />
    <button id="goBtn">Go</button>
    <div class="counts" id="counts">Syllables: 0</div>
  </div>

  <script>
    let session = null;
    const charMap = Object.fromEntries([..."abcdefghijklmnopqrstuvwxyz"].map((c, i) => [c, i + 1]));

    // Load ONNX session
    ort.InferenceSession.create('/assets/syllable-classifier.onnx').then(s => session = s);

    function encodeWord(word) {
      const clean = word.toLowerCase().replace(/[^a-z]/g, '').slice(0, 15);
      const arr = new BigInt64Array(15);
      for (let i = 0; i < clean.length; i++) {
        arr[i] = BigInt(charMap[clean[i]] || 0);
      }
      return arr;
    }

    async function predictWord(word) {
      const clean = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!session || !clean) return 0;

      const tensor = new ort.Tensor('int64', encodeWord(word), [1, 15]);
      const results = await session.run({ input_words: tensor });
      
      const outputTensor = results.syllable_logits || Object.values(results)[0];
      const logits = outputTensor.data;

      let maxIdx = 0, maxVal = -Infinity;
      for (let i = 0; i < logits.length; i++) {
        if (logits[i] > maxVal) { 
          maxVal = logits[i]; 
          maxIdx = i; 
        }
      }
      return maxIdx;
    }

    const inputEl = document.getElementById('input');
    const countsEl = document.getElementById('counts');
    const goBtn = document.getElementById('goBtn');

    // Automatically strip spaces or non-alphabetical characters in real-time
    inputEl.addEventListener('input', () => {
      inputEl.value = inputEl.value.replace(/[^a-zA-Z]/g, '');
    });

    // Run prediction on button click
    goBtn.addEventListener('click', async () => {
      const word = inputEl.value.trim();
      const count = await predictWord(word);
      countsEl.textContent = `Syllables: ${count}`;
    });
  </script>
</body>
</html>
